
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba EC2 - AWS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            text-align: center;
            padding: 80px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            color: #f59e0b;
        }

        .status {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¡EC2 funcionando!</h1>

        <p class="status">Servidor web activo</p>

        <p>Si puedes ver esta página, tu instancia AWS EC2 está sirviendo contenido HTML correctamente.</p>

        <p><strong>Proyecto:</strong> Prueba de despliegue</p>
        <p><strong>Servicio:</strong> Apache HTTP Server</p>

        <footer>
            Página de prueba para AWS EC2
        </footer>
    </div>

</body>
</html>
